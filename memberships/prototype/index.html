<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Working prototype of peakst8 Club Memberships: join a plan, book with it, and run the host side. Reverse-engineered from SweatPals Plans.">
<link rel="canonical" href="https://peakst8-basecamp.github.io/product-notes/memberships/prototype/">
<title>peakst8 Club Memberships</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: flow rail · live phone (or host dashboard) · state panel. Tokens are the peakst8 app's own (frontend globals.css, PrimaryButtonV2, ChoosePassTab, EventCtaSection). Dark only, like the app. */
:root{
  color-scheme:dark;
  --bg:#060709; --bg-2:#1a202a;            /* events-layout-gradient stops */
  --drawer:#050506; --surface:#121316; --bar:#2f3032; --step:#2d2d2e;
  --fg:#fafafa; --muted:#a1a1aa; --dim:#71717a; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.16);
  --blue-a:#0469d4; --blue-b:#002750;      /* PrimaryButtonV2 */
  --pass-a:#2e3192; --pass-b:#1bffff;      /* selected pass row */
  --gold-a:#d8c6aa; --gold-b:#c97e05; --gold-ink:#3a3b40;  /* coupon banner, active step */
  --ok:#34d399; --warn:#fbbf24; --bad:#ef4444;
  --sans:"Outfit",system-ui,-apple-system,sans-serif;
  --display:"Bricolage Grotesque","Outfit",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(141deg,var(--bg-2) 0%,var(--bg) 29%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pass-b);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top .brand{display:flex;align-items:center;gap:12px}
.top .brand svg{height:20px;width:auto}
.top .brand span{color:var(--muted);font-size:13px;border-left:1px solid var(--line-2);padding-left:12px}
.top .hint{color:var(--dim);font-size:12.5px}
.grid{display:grid;grid-template-columns:210px minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:minmax(0,1fr)}}

/* Rail */
.rail{display:grid;gap:18px;position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
.rail h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500}
.rail nav{display:grid;gap:2px}
.rail button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--muted);font-size:14px}
.rail button:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.rail button[aria-current="page"]{background:rgba(255,255,255,.08);color:var(--fg)}
.badge{min-width:20px;height:20px;border-radius:999px;padding:0 6px;display:inline-grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--gold-ink);background:linear-gradient(108deg,var(--gold-a),var(--gold-b))}
@media (max-width:1180px){
  .rail{position:static;grid-template-columns:minmax(0,1fr)}
  .rail .grp{min-width:0}
  .rail nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
  .rail button{flex:none;border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;font-size:13px}
}

/* Stage */
.stage{display:grid;justify-items:center;min-width:0}
.phone{width:min(100%,392px);height:780px;border-radius:44px;border:1px solid var(--line-2);background:var(--bg);background-image:linear-gradient(141deg,var(--bg-2) 0%,var(--bg) 29%);position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.phone .scroll{position:absolute;inset:0;overflow-y:auto;padding:18px 18px 110px}
.dash{width:100%;min-height:780px;border-radius:24px;border:1px solid var(--line-2);background:#0b0c0e;position:relative;overflow:hidden}
.dash .scroll{padding:22px clamp(16px,3vw,28px) 40px;overflow-x:auto}
.sb{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:0 6px 12px}
.appbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:34px;height:34px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);display:grid;place-items:center}
.appbar b{font-size:16px;font-weight:600}

/* Type */
h1.d,h2.d{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1.d{font-size:30px;line-height:1.05}
h2.d{font-size:20px;line-height:1.15}
.sub{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.num{font-variant-numeric:tabular-nums}
.strike{position:relative;display:inline-block;color:var(--muted)}
.strike::after{content:"";position:absolute;left:0;top:50%;width:100%;height:2px;background:currentColor;transform:rotate(-8deg)}

/* Pieces */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:8px;border:0;font-weight:500;font-size:15px;color:var(--fg);background:linear-gradient(90deg,var(--blue-a),var(--blue-b));transition:opacity .15s,transform .1s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;height:52px}
.btn.ghost{background:transparent;border:1px solid var(--line-2)}
.btn.danger{background:rgba(239,68,68,.16);color:#fca5a5;border:1px solid rgba(239,68,68,.35)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.pill.warn{color:var(--warn);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.pill.bad{color:#fca5a5;border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08)}
.pill.gold{color:var(--gold-ink);border:0;background:linear-gradient(108deg,var(--gold-a),var(--gold-b))}
.card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hr{height:1px;background:var(--line);margin:4px 0}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start;color:var(--muted);line-height:1.45}
.list li svg{flex:none;margin-top:2px}

/* Club header */
.club{display:flex;gap:12px;align-items:center}
.club .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#ff6b3d,#ffb547);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:#1a0d05}
.plan{display:grid;gap:10px;padding:16px;border-radius:16px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);text-align:left;width:100%}
.plan:hover{border-color:rgba(255,255,255,.3)}
.plan .price{font-family:var(--display);font-weight:700;font-size:22px}
.plan .per{color:var(--muted);font-size:13px;font-weight:400;font-family:var(--sans)}
.plan .feat{display:flex;gap:6px;flex-wrap:wrap}
.event{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);text-align:left;width:100%}
.event .art{height:64px;border-radius:10px;background:linear-gradient(160deg,#1e3a5f,#0f172a);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;line-height:1;text-align:center;color:#cfe8ff}
.event b{font-size:14.5px;font-weight:600}
.pill.perk{color:#cffafe;border-color:rgba(27,255,255,.35);background:rgba(27,255,255,.06)}
.perkcard{display:grid;gap:8px;padding:14px;border-radius:14px;border:1px dashed var(--line-2);background:rgba(255,255,255,.02);color:var(--muted)}
.perkcard b{color:var(--fg)}
.perkcard.open{border-style:solid;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.05);color:var(--fg)}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--fg)}
.saved{display:grid;gap:2px;padding:12px;border-radius:12px;background:linear-gradient(108deg,rgba(216,198,170,.16),rgba(201,126,5,.1));border:1px solid rgba(216,198,170,.3)}
.saved b{font-family:var(--display);font-size:20px;color:var(--gold-a)}
.saved span{font-size:12.5px;color:var(--muted)}
.link{background:none;border:0;padding:0;color:#7dd3fc;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.memberprice{font-size:12px;font-weight:600;color:var(--gold-ink);background:linear-gradient(108deg,var(--gold-a),var(--gold-b));border-radius:6px;padding:2px 6px}

/* Pass rows (ChoosePassTab) */
.pass{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:0;outline:1px solid #6b7280;background:transparent}
.pass:hover:not([aria-disabled="true"]){background:linear-gradient(90deg,var(--pass-a) -1.67%,var(--pass-b) 186.67%);outline-color:transparent}
.pass[aria-checked="true"]{background:linear-gradient(90deg,var(--pass-a) -1.67%,var(--pass-b) 186.67%);outline-color:transparent}
.pass[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.pass .l{display:flex;gap:10px;align-items:center;min-width:0}
.pass .t{display:grid;gap:2px;min-width:0}
.pass .t span:last-child{color:var(--muted);font-size:13px}
.pass[aria-checked="true"] .t span:last-child{color:#dbeafe}
.pass .r{text-align:right;flex:none;display:grid;gap:2px;font-size:15px}
.withplan{font-size:11.5px;color:var(--gold-a)}

/* Sticky CTA bar (EventCtaSection) */
.ctabar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px 18px;background:linear-gradient(transparent,rgba(5,5,6,.9) 30%)}
.ctabar .inner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bar);border-radius:10px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ctabar .lbl{color:#9ca3af;font-size:13px}
.ctabar .val{font-size:16px;font-weight:500}
.banner-gold{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:10px 10px 0 0;background:linear-gradient(108deg,var(--gold-a) -19%,var(--gold-b) 136%);color:var(--gold-ink);font-size:13px;font-weight:500}
.banner-gold + .inner{border-radius:0 0 10px 10px}

/* Sheet (RegisterEventDrawerFinal) */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;animation:fade .2s ease-out}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;z-index:21;background:var(--drawer);border:1px solid var(--line);border-bottom:0;border-radius:32px 32px 0 0;padding:22px 18px 22px;animation:up .32s cubic-bezier(.16,1,.3,1)}
.sheet .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}
.sheet .head .title{font-size:20px;font-weight:600}
.x{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--fg);opacity:.75;font-size:22px;line-height:1}
.steps{display:flex;gap:6px;margin:4px 0 16px;overflow-x:auto}
.steps span{flex:none;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--step);color:var(--muted)}
.steps span.on{color:var(--gold-ink);background:linear-gradient(108deg,#d8c6aa 0%,#f1d593 30%,#e6b85c 60%,#c97e05 100%);font-weight:600}
.steps span.done{color:var(--fg)}
.sum{display:grid;gap:8px;font-variant-numeric:tabular-nums}
.sum .row{font-size:14px;color:var(--muted)}
.sum .row b{color:var(--fg);font-weight:500}
.sum .total{font-size:16px;color:var(--fg);font-weight:600}
.note{font-size:12.5px;color:var(--dim);line-height:1.5}
.offer{display:grid;gap:6px;padding:14px;border-radius:14px;border:1px solid rgba(216,198,170,.4);background:linear-gradient(140deg,rgba(216,198,170,.12),rgba(201,126,5,.08));text-align:left;width:100%}
.offer[aria-checked="true"]{border-color:var(--gold-a);box-shadow:inset 0 0 0 1px var(--gold-a)}

/* Razorpay mock */
.rzp{position:absolute;inset:auto 14px 14px 14px;z-index:30;background:#fff;color:#111827;border-radius:16px;overflow:hidden;animation:up .3s cubic-bezier(.16,1,.3,1)}
.rzp .hd{background:#0f172a;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.rzp .bd{padding:16px;display:grid;gap:10px}
.rzp .opt{display:flex;justify-content:space-between;align-items:center;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;color:#111827;width:100%;text-align:left}
.rzp .opt[aria-checked="true"]{border-color:#2563eb;box-shadow:inset 0 0 0 1px #2563eb}
.rzp .pay{height:46px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:600;font-size:15px}
.rzp small{color:#6b7280;font-size:12px;line-height:1.45}

/* Passes */
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.05);border-radius:10px;padding:4px}
.tabs button{flex:1;height:34px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--bar);color:var(--fg)}
.meter{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pass-a),var(--pass-b))}
.ticket{border-radius:16px;overflow:hidden;border:1px solid var(--line-2)}
.ticket .top2{padding:16px;background:linear-gradient(135deg,#1e3a5f,#0f172a)}
.ticket .qr{padding:16px;display:grid;justify-items:center;gap:8px;background:#fff;color:#111}

/* Host dashboard */
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);display:grid;gap:4px}
.kpi b{font-family:var(--display);font-size:22px;font-weight:700}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tbl table{width:100%;min-width:640px;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:12px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl select,.field input,.field select{background:#141518;border:1px solid var(--line-2);border-radius:8px;height:36px;padding:0 10px}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:720px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select{width:100%;height:40px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{background:rgba(27,255,255,.1);border-color:rgba(27,255,255,.5);color:#cffafe}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.toggle input{width:18px;height:18px;accent-color:#1bffff}
.menu{display:flex;gap:6px;flex-wrap:wrap}

/* Side panel */
.panel{display:grid;gap:14px;position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
@media (max-width:1180px){.panel{position:static}}
.panel .card{padding:14px}
.panel h4{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--dim)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.log{display:grid;gap:8px;max-height:260px;overflow-y:auto;font-size:12.5px}
.log div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;color:var(--muted);line-height:1.4}
.log time{color:var(--dim);font-variant-numeric:tabular-nums}
.rule{display:grid;gap:6px;font-size:12.5px;line-height:1.45;color:var(--muted);margin:0;padding-left:18px}
.rule li.pass-ok::marker{color:var(--ok)}.rule li.fail::marker{color:var(--bad)}
.ctrl{display:grid;gap:8px}
.ctrl .row{font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f4f4f5;color:#111;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .25s ease-out;max-width:calc(100% - 32px)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{animation-name:toastIn}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">

/* ───────────────────────── Data (mirrors schema-draft.prisma) ───────────────────────── */
const DAY=86400000;
const START=new Date('2026-11-02T09:00:00+05:30');
const fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const d=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const dLong=t=>new Date(t).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const addMonths=(t,n)=>{const x=new Date(t);x.setMonth(x.getMonth()+n);return x.getTime()};
const INTERVAL={MONTHLY:{label:'month',months:1},QUARTERLY:{label:'quarter',months:3}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function seed(){

      {id:'p2',kind:'MEMBERSHIP',name:'8 Runs a Month',description:'Two runs a week, any training session.',coverage:['TRAINING'],limitPeriod:'PER_MONTH',usageLimit:8,
       prices:[{id:'pp3',label:'Monthly',amount:999,billing:'RECURRING',interval:'MONTHLY',joiningFee:0}],intro:null,approval:false,cancellation:'REVIEW',minCommitment:3,featured:false,published:true,perks:{earlyAccessHours:24,guestPasses:0,perkIds:['k1']}},

    ],
    events:[
      {id:'e1',type:'TRAINING',name:'Saturday Cubbon Park 5K',short:'SAT\n5K',date:now+5*DAY,place:'Cubbon Park, Gate 2',
       categories:[{id:'c1',name:'General',info:'Run with the pack, 5:30 AM start',base:299,policies:{p1:{policy:'FREE'},p2:{policy:'FREE'},p3:{policy:'FREE'},p4:{policy:'FREE'}}},
                   {id:'c2',name:'With breakfast',info:'Post-run breakfast at Airlines Hotel',base:549,policies:{p1:{policy:'CUSTOM_FLAT',value:299},p4:{policy:'CUSTOM_FLAT',value:299}}}]},

      {id:'e3',type:'SINGLE_DAY',name:'Monsoon 10K Social',short:'10K\nSOCIAL',date:now+34*DAY,place:'Lalbagh West Gate',publicOpensAt:now+2*DAY,
       categories:[{id:'c4',name:'Timed 10K',info:'Chip timing, medal, finisher tee',base:799,policies:{p1:{policy:'HALF'},p4:{policy:'FREE'}}},
                   {id:'c5',name:'Fun run 3K',info:'Untimed, families welcome',base:399,policies:{}}]},
    ],

      {id:'k1',partner:'Decathlon Indiranagar',offer:'15% off running shoes and watches',redeem:'Show your plan at billing',code:'FYF15'},
      {id:'k2',partner:'Third Wave Coffee, Church Street',offer:'Free cold brew after Saturday runs',redeem:'Show your plan card at the counter',code:null},
      {id:'k3',partner:'Sportsmed Physio',offer:'First running assessment free',redeem:'Book with the code',code:'PACERFREE'},
    ],
    userPlans:[], joinRequests:[], bookings:[], usages:[], guestPasses:[],
    members:[ // other holders, for the host view
      {id:'m1',name:'Priya Raghavan',planId:'p1',priceId:'pp1',status:'ACTIVE',periodEnd:now+18*DAY,used:6},
      {id:'m2',name:'Karthik S',planId:'p2',priceId:'pp3',status:'ACTIVE',periodEnd:now+9*DAY,used:7},
      {id:'m3',name:'Neha Kulkarni',planId:'p1',priceId:'pp2',status:'PAUSED',periodEnd:now+61*DAY,used:0},
      {id:'m4',name:'Rohan Das',planId:'p3',priceId:'pp4',status:'ACTIVE',periodEnd:now+40*DAY,used:4},
      {id:'m5',name:'Ishita Bose',planId:'p1',priceId:'pp1',status:'PAST_DUE',periodEnd:now-1*DAY,used:9},
    ],
    otherRequests:[{id:'r9',name:'Vikram Iyer',planId:'p4',priceId:'pp5',status:'PENDING',at:now-1*DAY}],
    log:[{t:now,m:'Demo started. Aarav has no plan yet.'}],
  };
}
let S=seed();

const planById=id=>S.plans.find(p=>p.id===id);
const priceById=id=>{for(const p of S.plans){const x=p.prices.find(r=>r.id===id);if(x)return x}return null};
const eventById=id=>S.events.find(e=>e.id===id);
const log=m=>S.log.unshift({t:S.now,m});
function toast(m){S.toast=m;clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;renderToast()},2600);renderToast()}

/* ───────────────────────── Rules (README: "How checkout prices a booking") ───────────────────────── */
const BOOKABLE=['ACTIVE','CANCELS_AT_PERIOD_END'];
/* Perks (club admins set them per plan under Host → Perks) */
const livePlans=()=>S.userPlans.filter(u=>BOOKABLE.includes(u.status));
const perkById=id=>S.perks.find(k=>k.id===id);
function unlockedPerkIds(){const s=new Set();livePlans().forEach(u=>(planById(u.planId).perks.perkIds||[]).forEach(id=>s.add(id)));return s}
function plansUnlocking(perkId){return S.plans.filter(p=>p.published&&(p.perks.perkIds||[]).includes(perkId))}
function perkPills(plan){const k=plan.perks;const out=[];if(k.earlyAccessHours)out.push(k.earlyAccessHours+'h early access');if(k.guestPasses)out.push(k.guestPasses+' guest pass'+(k.guestPasses>1?'es':'')+' / period');if(k.perkIds.length)out.push(k.perkIds.length+' partner perk'+(k.perkIds.length>1?'s':''));return out}
function earlyAccess(event){ // returns {open, viaPlan, opensAt}
  if(!event.publicOpensAt||S.now>=event.publicOpensAt)return {open:true};
  const via=livePlans().map(u=>planById(u.planId)).filter(p=>p.perks.earlyAccessHours&&p.coverage.includes(event.type)&&S.now>=event.publicOpensAt-p.perks.earlyAccessHours*3600000).sort((a,b)=>b.perks.earlyAccessHours-a.perks.earlyAccessHours)[0];
  return via?{open:true,viaPlan:via,opensAt:event.publicOpensAt}:{open:false,opensAt:event.publicOpensAt};
}
function savings(up){const all=S.usages.filter(u=>u.userPlanId===up.id&&u.status!=='RELEASED');return {period:all.filter(u=>u.eventDate>=up.periodStart&&u.eventDate<up.periodEnd).reduce((s,u)=>s+u.saved,0),total:all.reduce((s,u)=>s+u.saved,0),runs:all.length}}
function guestPassesLeft(up){const plan=planById(up.planId);const used=S.guestPasses.filter(g=>g.userPlanId===up.id&&g.periodStart===up.periodStart).length;return {left:Math.max(0,plan.perks.guestPasses-used),limit:plan.perks.guestPasses}}
function priceFor(policy,base){
  switch(policy.policy){
    case 'FREE':return 0;case 'HALF':return Math.round(base/2);case 'FULL':return base;
    case 'CUSTOM_PERCENT':return Math.round(base*(1-policy.value/100));case 'CUSTOM_FLAT':return Math.max(0,base-policy.value);
  } return base;
}
function policyLabel(p){if(!p)return 'No benefit';return {FREE:'Free',HALF:'Half price',FULL:'Full price',CUSTOM_PERCENT:p.value+'% off',CUSTOM_FLAT:fmt(p.value)+' off'}[p.policy]}
function periodFor(up,eventDate){ // the billing period that contains the event date
  const price=priceById(up.priceId);
  if(price.billing==='ONE_TIME')return {start:up.startedAt,end:up.periodEnd};
  let s=up.periodStart,e=up.periodEnd;const m=INTERVAL[price.interval].months;
  while(eventDate>=e){s=e;e=addMonths(e,m)}
  return {start:s,end:e};
}
function usedIn(up,from,to){return S.usages.filter(u=>u.userPlanId===up.id&&u.status!=='RELEASED'&&u.eventDate>=from&&u.eventDate<to).length}
function allowance(up,eventDate){
  const plan=planById(up.planId);
  if(plan.limitPeriod==='UNLIMITED')return {left:Infinity,limit:null};
  if(plan.limitPeriod==='TOTAL'){const used=S.usages.filter(u=>u.userPlanId===up.id&&u.status!=='RELEASED').length;const lim=(up.creditsOverride??plan.usageLimit);return {left:lim-used,limit:lim,used}}
  const p=periodFor(up,eventDate);const used=usedIn(up,p.start,p.end);const lim=(up.creditsOverride??plan.usageLimit);return {left:lim-used,limit:lim,used,period:p};
}
/* Returns every candidate with the step that kept or dropped it, so the panel can show the reasoning. */
function evaluate(event,cat){
  const steps=[];const cands=[];
  if(!S.userPlans.length){steps.push({ok:false,t:'No plans on this account, so the ticket is full price.'});return {best:null,cands,steps}}
  for(const up of S.userPlans){
    const plan=planById(up.planId);const tag=plan.name;
    if(!BOOKABLE.includes(up.status)){steps.push({ok:false,t:`${tag}: status ${up.status}, so it can't be used.`});continue}
    if(plan.kind==='PACK'&&event.date>up.periodEnd){steps.push({ok:false,t:`${tag}: expires ${d(up.periodEnd)}, before this event.`});continue}
    if(up.status==='CANCELS_AT_PERIOD_END'&&event.date>=up.periodEnd){steps.push({ok:false,t:`${tag}: ends ${d(up.periodEnd)}, before this event.`});continue}
    if(!plan.coverage.includes(event.type)){steps.push({ok:false,t:`${tag}: doesn't cover ${event.type.toLowerCase().replace('_',' ')} events.`});continue}
    const pol=cat.policies[plan.id];
    if(!pol){steps.push({ok:false,t:`${tag}: the host set no plan price on "${cat.name}".`});continue}
    const a=allowance(up,event.date);
    if(a.left<=0){steps.push({ok:false,t:`${tag}: ${a.limit} of ${a.limit} used${a.period?' for '+d(a.period.start)+' – '+d(a.period.end):''}.`});continue}
    const price=priceFor(pol,cat.base);
    cands.push({up,plan,pol,price,left:a.left,limit:a.limit});
    steps.push({ok:true,t:`${tag}: ${policyLabel(pol)} → ${fmt(price)}${a.limit?` (${a.left} of ${a.limit} left)`:''}.`});
  }
  cands.sort((x,y)=>x.price-y.price||(x.plan.kind==='PACK'?-1:0)-(y.plan.kind==='PACK'?-1:0)||((x.limit?0:1)-(y.limit?0:1)));
  const best=cands[0]||null;
  if(best)steps.push({ok:true,t:`Picked ${best.plan.name}: lowest price${cands.length>1?' of '+cands.length:''}.`});
  else steps.push({ok:false,t:'No plan applies, so the ticket is full price.'});
  return {best,cands,steps};
}

/* ───────────────────────── Actions ───────────────────────── */
function startPlan(planId,priceId,{intro=false,source='PURCHASE'}={}){
  const plan=planById(planId),price=priceById(priceId);
  const startedAt=S.now;
  let periodEnd;
  if(price.billing==='ONE_TIME')periodEnd=S.now+price.validityDays*DAY;
  else if(intro)periodEnd=S.now+plan.intro.days*DAY;
  else periodEnd=addMonths(S.now,INTERVAL[price.interval].months);
  const up={id:'up'+(S.seq++),planId,priceId,status:'ACTIVE',source,startedAt,periodStart:S.now,periodEnd,introActive:intro,charges:[],history:[]};
  const first=intro?plan.intro.amount:price.amount;
  up.charges.push({type:'FIRST_PAYMENT',amount:first+(price.joiningFee||0),at:S.now});
  up.history.push({t:S.now,m:'Joined'+(intro?' on intro offer':'')});
  S.userPlans.push(up);
  log(`${S.user.name.split(' ')[0]} joined ${plan.name} (${price.label}${intro?', intro '+fmt(plan.intro.amount):''}). Charged ${fmt(first+(price.joiningFee||0))}.`);
  return up;
}
function requestJoin(planId,priceId){
  S.joinRequests.push({id:'jr'+(S.seq++),planId,priceId,status:'PENDING',at:S.now});
  log(`Join request sent for ${planById(planId).name}. Host notified.`);
}
function book(event,cat,choice){
  const price=choice?choice.price:cat.base;
  const b={id:'b'+(S.seq++),eventId:event.id,catId:cat.id,price,base:cat.base,userPlanId:choice?choice.up.id:null,at:S.now};
  S.bookings.push(b);
  if(choice){
    S.usages.push({id:'us'+(S.seq++),userPlanId:choice.up.id,bookingId:b.id,eventDate:event.date,status:'CONSUMED',saved:cat.base-price});
    choice.up.history.push({t:S.now,m:`Used for ${event.name}`});
  }
  log(`Booked ${event.name} · ${cat.name}: ${choice?`${fmt(price)} with ${choice.plan.name} (saved ${fmt(cat.base-price)})`:fmt(price)}.`);
  return b;
}
function cancelBooking(b){
  const e=eventById(b.eventId);
  S.bookings=S.bookings.filter(x=>x!==b);
  const u=S.usages.find(x=>x.bookingId===b.id);
  if(u){u.status='RELEASED';log(`Cancelled ${e.name}. Plan credit released.`)} else log(`Cancelled ${e.name}.`);
}
function advanceToRenewal(){
  const live=S.userPlans.filter(u=>['ACTIVE','CANCELS_AT_PERIOD_END','PAST_DUE'].includes(u.status)||u.status==='PAUSED');
  const next=live.filter(u=>u.status!=='PAUSED').map(u=>u.periodEnd).sort((a,b)=>a-b)[0];
  if(!next){toast('No plan is due. Join a plan first.');return}
  S.now=next;
  for(const up of S.userPlans){
    if(up.periodEnd>S.now||up.status==='PAUSED'||up.status==='ENDED')continue;
    const plan=planById(up.planId),price=priceById(up.priceId);
    if(up.status==='CANCELS_AT_PERIOD_END'){up.status='ENDED';up.history.push({t:S.now,m:'Ended'});log(`${plan.name} ended as scheduled.`);continue}
    if(price.billing==='ONE_TIME'){up.status='ENDED';up.history.push({t:S.now,m:'Expired'});log(`${plan.name} expired.`);continue}
    if(up.status==='PAST_DUE')continue;
    log(`Pre-debit notice sent 24 h before: ${fmt(up.priceOverride??price.amount)} for ${plan.name}.`);
    if(S.failNextRenewal){
      up.status='PAST_DUE';up.history.push({t:S.now,m:'Renewal failed'});S.failNextRenewal=false;
      log(`Renewal of ${plan.name} failed (UPI mandate declined). Razorpay will retry; fix-billing link sent.`);
    } else {
      const amt=up.priceOverride??price.amount;
      up.periodStart=up.periodEnd;up.periodEnd=addMonths(up.periodEnd,INTERVAL[price.interval].months);up.introActive=false;up.creditsOverride=undefined;
      up.charges.push({type:'RENEWAL',amount:amt,at:S.now});up.history.push({t:S.now,m:'Renewed '+fmt(amt)});
      log(`${plan.name} renewed: charged ${fmt(amt)}. New period ${d(up.periodStart)} – ${d(up.periodEnd)}.`);
    }
  }
  render();
}
function fixBilling(up){
  const plan=planById(up.planId),price=priceById(up.priceId);
  const amt=up.priceOverride??price.amount;
  up.status='ACTIVE';up.periodStart=up.periodEnd;up.periodEnd=addMonths(up.periodEnd,INTERVAL[price.interval].months);up.introActive=false;
  up.charges.push({type:'FIX_BILLING',amount:amt,at:S.now});up.history.push({t:S.now,m:'Fixed billing '+fmt(amt)});
  log(`Billing fixed for ${plan.name}: ${fmt(amt)} paid through the fix-billing link.`);
}

const statusPill=s=>{const map={ACTIVE:['ok','Active'],CANCELS_AT_PERIOD_END:['warn','Cancels at period end'],PAST_DUE:['bad','Payment failed'],PAUSED:['warn','Paused'],ENDED:['','Ended'],PENDING:['warn','Request pending'],APPROVED:['ok','Approved'],REJECTED:['bad','Not approved']};const [c,l]=map[s]||['',s];return `<span class="pill ${c}">${l}</span>`};
function priceLine(price){return price.billing==='ONE_TIME'?`${fmt(price.amount)} <span class="per">one-time · ${price.validityDays} days</span>`:`${fmt(price.amount)} <span class="per">/ ${INTERVAL[price.interval].label}</span>`}
function limitText(plan){return plan.limitPeriod==='UNLIMITED'?'Unlimited bookings':plan.limitPeriod==='TOTAL'?`${plan.usageLimit} bookings`:`${plan.usageLimit} bookings a ${plan.limitPeriod.replace('PER_','').toLowerCase()}`}
function coverText(plan){return plan.coverage.map(c=>({TRAINING:'Training runs',SINGLE_DAY:'Race days'}[c]||c)).join(' + ')}
function heldPlan(planId){return S.userPlans.find(u=>u.planId===planId&&u.status!=='ENDED')}
function reqFor(planId){return [...S.joinRequests].reverse().find(r=>r.planId===planId&&r.status!=='WITHDRAWN')}
function planButton(plan){ // SweatPals offer-card states: Join · Request to join · Request pending/Withdraw · Not approved · View
  if(heldPlan(plan.id))return {label:'View',kind:'ghost',act:'passes'};
  const r=reqFor(plan.id);
  if(plan.approval&&r){if(r.status==='PENDING')return {label:'Request pending · Withdraw',kind:'ghost',act:'withdraw:'+r.id};if(r.status==='REJECTED')return {label:'Not approved',kind:'ghost',disabled:true};if(r.status==='APPROVED')return {label:'Approved · Complete payment',kind:'',act:'plan:'+plan.id}}
  return {label:plan.approval?'Request to join':'Join',kind:'',act:'plan:'+plan.id};
}

function qr(seedStr){let h=0;for(const ch of seedStr)h=(h*31+ch.charCodeAt(0))>>>0;const n=21,s=6;let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++){const corner=(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);let on;if(corner){const cx=x<7?x:x-(n-7),cy=y<7?y:y-(n-7);on=cx===0||cy===0||cx===6||cy===6||(cx>1&&cx<5&&cy>1&&cy<5)}else{h=(h*1103515245+12345)>>>0;on=(h>>16)&1}if(on)r+=`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}"/>`}return `<svg width="${n*s}" height="${n*s}" viewBox="0 0 ${n*s} ${n*s}" fill="#111" role="img" aria-label="Ticket QR code">${r}</svg>`}

function go(view,arg){S.view=view;S.viewArg=arg||null;S.sheet=null;render();const sc=document.querySelector('#stage .scroll');if(sc)sc.scrollTop=0}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const [a,arg]=el.dataset.act.split(/:(.*)/s);if(!a)return;
  if(el.type==='checkbox'&&a!=='agree'&&a!=='failtoggle')return;
  const sh=S.sheet;
  switch(a){
    case 'go':go(arg);break;
    case 'event':go('event',arg);break;
    case 'passes':S.passTab='plans';go('passes');break;
    case 'tab':S.passTab=arg;render();break;
    case 'ticket':go('ticket',arg);break;
    case 'manage':go('manage',arg);break;
    case 'close':S.sheet=null;render();break;
    case 'plan':{const p=planById(arg);if(S.view.startsWith('h-'))go('club');S.sheet={type:'plan',planId:p.id,priceId:p.prices[0].id,step:'Plan'};render();break}
    case 'price':sh.priceId=arg;render();break;
    case 'step':sh.step=arg;render();break;
    case 'intro':sh.intro=arg==='on';render();break;
    case 'agree':sh.agree=el.checked;render();break;
    case 'sendrequest':requestJoin(sh.planId,sh.priceId);S.sheet={type:'requested'};render();break;
    case 'withdraw':{const r=S.joinRequests.find(x=>x.id===arg);r.status='WITHDRAWN';log(`Join request for ${planById(r.planId).name} withdrawn.`);toast('Request withdrawn');render();break}
    case 'pay':{const plan=planById(sh.planId),price=priceById(sh.priceId);const intro=plan.intro&&plan.intro.priceId===price.id&&sh.intro!==false&&!S.userPlans.some(u=>u.planId===plan.id);
      const amt=(intro?plan.intro.amount:price.amount)+(price.joiningFee||0);
      sh.rzp={amount:amt,recurring:price.billing==='RECURRING',maxAmount:price.amount,every:price.billing==='RECURRING'?INTERVAL[price.interval].label:'',then:'join',intro};render();break}
    case 'checkout':S.sheet={type:'checkout',eventId:arg};render();break;
    case 'cat':sh.catId=arg;render();break;
    case 'confirmbook':{const e=eventById(sh.eventId);const c=e.categories.find(x=>x.id===sh.catId)||e.categories[0];const ev2=evaluate(e,c);const total=ev2.best?ev2.best.price:c.base;
      if(total===0){const b=book(e,c,ev2.best);S.sheet=null;toast('Registration complete');go('ticket',b.id)}
      else{sh.catId=c.id;sh.rzp={amount:total,recurring:false,then:'book'};render()}break}
    case 'rzp':{if(arg==='upi'||arg==='card'){sh.rzp.method=arg;render();break}
      if(arg==='cancel'){sh.rzp=null;render();break}
      const r=sh.rzp;
      if(r.then==='join'){
        const plan=planById(sh.planId);const up=startPlan(sh.planId,sh.priceId,{intro:r.intro});
        const jr=reqFor(plan.id);if(jr&&jr.status==='APPROVED')jr.status='CONVERTED';
        S.sheet={type:'joined',upId:up.id};render();
      } else {const e=eventById(sh.eventId);const c=e.categories.find(x=>x.id===sh.catId);const ev2=evaluate(e,c);const b=book(e,c,ev2.best);S.sheet=null;toast('Payment successful');go('ticket',b.id)}
      break}
    case 'cancelask':S.sheet={type:'cancel',upId:arg};render();break;
    case 'docancel':{const up=S.userPlans.find(u=>u.id===sh.upId);const plan=planById(up.planId);
      if(plan.cancellation==='AUTO'){up.status='CANCELS_AT_PERIOD_END';up.history.push({t:S.now,m:'Cancelled; access until '+d(up.periodEnd)});log(`${plan.name} cancelled. Access until ${d(up.periodEnd)}; no more charges.`);toast('Plan cancelled')}
      else{up.cancelRequested=S.now;up.history.push({t:S.now,m:'Requested cancellation'});log(`Cancellation request for ${plan.name} sent to the host.`);toast('Request sent')}
      S.sheet=null;render();break}
    case 'cancelbook':{const b=S.bookings.find(x=>x.id===arg);cancelBooking(b);toast('Ticket cancelled');go('passes');break}
    case 'fix':{const up=S.userPlans.find(u=>u.id===arg);if(up){fixBilling(up);toast('Billing fixed. Plan active again.');render()}break}
    case 'perks':go('club');setTimeout(()=>{const el=document.getElementById('perks');if(el)el.scrollIntoView({block:'start'})},0);break;
    case 'guest':S.sheet={type:'guest',upId:arg};render();break;
    case 'sendguest':{const name=(document.getElementById('gname').value||'').trim()||'Riya';const up=S.userPlans.find(u=>u.id===sh.upId);
      S.guestPasses.push({id:'gp'+(S.seq++),userPlanId:up.id,name,status:'SENT',at:S.now,periodStart:up.periodStart});
      log(`Guest pass sent to ${name} on WhatsApp (${planById(up.planId).name}).`);toast('Pass sent to '+name);render();break}
    case 'guestclaim':{const g=S.guestPasses.find(x=>x.id===arg);const e=S.events.find(x=>x.type==='TRAINING');g.status='REDEEMED';g.eventName=e.name;
      log(`${g.name} claimed the guest pass and booked ${e.name} free. Added to the club's leads as a first-timer.`);toast(g.name+' booked free');render();break}
    case 'addperk':{const v=id=>(document.getElementById(id).value||'').trim();const partner=v('k-partner')||'Ather Space, Indiranagar',offer=v('k-offer')||'Free test ride + ₹2,000 off';
      const k={id:'k'+(S.seq++),partner,offer,redeem:v('k-redeem')||'Show your plan card',code:v('k-code')||null};S.perks.push(k);
      S.plans.filter(p=>p.kind==='MEMBERSHIP'&&p.published).forEach(p=>p.perks.perkIds.push(k.id));
      log(`Host added partner perk: ${partner} (${offer}), unlocked for every published membership.`);toast('Perk added');render();break}
    case 'renew':advanceToRenewal();break;
    case 'failtoggle':S.failNextRenewal=el.checked;log(S.failNextRenewal?'Next renewal set to fail.':'Next renewal set to succeed.');renderPanel();break;
    case 'reset':S=seed();go('club');toast('Demo reset');break;
    // host
    case 'toggleplan':{const p=planById(arg);p.published=!p.published;log(`Host ${p.published?'published':'unlisted'} ${p.name}.`);render();break}
    case 'f-kind':S.form.kind=arg;S.form.limitPeriod=arg==='PACK'?'TOTAL':'PER_MONTH';render();break;
    case 'f-cov':{const c=S.form.coverage;const i=c.indexOf(arg);i>=0?c.splice(i,1):c.push(arg);render();break}
    case 'createplan':{const f=S.form;const id='p'+(S.seq++),pid='pp'+(S.seq++);
      const plan={id,kind:f.kind,name:f.name.trim(),description:f.description.trim(),coverage:[...f.coverage],limitPeriod:f.limitPeriod,usageLimit:f.limitPeriod==='UNLIMITED'?null:Number(f.usageLimit),
        prices:[f.kind==='PACK'?{id:pid,label:'One-time',amount:Number(f.amount),billing:'ONE_TIME',validityDays:Number(f.validityDays),joiningFee:0}:{id:pid,label:f.interval==='MONTHLY'?'Monthly':'Quarterly',amount:Number(f.amount),billing:'RECURRING',interval:f.interval,joiningFee:0}],
        intro:f.kind==='MEMBERSHIP'&&f.intro?{priceId:pid,amount:Number(f.introAmount),days:Number(f.introDays)}:null,approval:f.approval,cancellation:f.cancellation,minCommitment:0,featured:false,published:true,perks:{earlyAccessHours:0,guestPasses:0,perkIds:[]}};
      S.plans.push(plan);
      const pol=f.policy==='CUSTOM_PERCENT'?{policy:'CUSTOM_PERCENT',value:30}:{policy:f.policy};
      S.events.forEach(e=>{if(plan.coverage.includes(e.type))e.categories.forEach(c=>{c.policies[id]={...pol}})});
      log(`Host published ${plan.name} and set "${policyLabel(pol)}" on every covered pass.`);S.form=null;toast(plan.name+' is live on the club page');go('h-plans');break}
    case 'h-pause':{const up=S.userPlans.find(u=>u.id===arg);up.status='PAUSED';up.pausedAt=S.now;up.history.push({t:S.now,m:'Paused by the club'});log(`Host paused ${planById(up.planId).name} for ${S.user.name}. Billing and access stopped.`);toast('Plan paused');render();break}
    case 'h-resume':{const up=S.userPlans.find(u=>u.id===arg);const paused=S.now-(up.pausedAt||S.now);up.periodEnd+=paused;up.status='ACTIVE';up.history.push({t:S.now,m:'Resumed by the club'});log(`Host resumed ${planById(up.planId).name}. End date moved by ${Math.round(paused/DAY)} days.`);toast('Plan resumed');render();break}
    case 'h-credits':{const up=S.userPlans.find(u=>u.id===arg);const a=allowance(up,S.now);up.creditsOverride=(up.creditsOverride??planById(up.planId).usageLimit)+2;up.history.push({t:S.now,m:'Club added 2 credits'});log(`Host added 2 credits to ${S.user.name}'s ${planById(up.planId).name} (${a.left+2} left).`);toast('2 credits added');render();break}
    case 'h-end':{const up=S.userPlans.find(u=>u.id===arg);up.status='ENDED';up.periodEnd=S.now;up.history.push({t:S.now,m:'Cancelled by the club'});log(`Host cancelled ${planById(up.planId).name} for ${S.user.name} immediately.`);toast('Plan cancelled');render();break}
    case 'h-approvecancel':{const up=S.userPlans.find(u=>u.id===arg);up.status='CANCELS_AT_PERIOD_END';up.history.push({t:S.now,m:'Club approved cancellation'});log(`Host approved cancellation. ${planById(up.planId).name} ends ${d(up.periodEnd)}.`);toast('Cancellation approved');render();break}
    case 'h-approve':case 'h-reject':{const r=S.joinRequests.find(x=>x.id===arg)||S.otherRequests.find(x=>x.id===arg);r.status=a==='h-approve'?'APPROVED':'REJECTED';log(`Host ${a==='h-approve'?'approved':'declined'} ${r.name||S.user.name}'s request for ${planById(r.planId).name}.`);toast(a==='h-approve'?'Approved. Member can now pay.':'Request declined');render();break}
  }
});
document.addEventListener('input',ev=>{const el=ev.target;
  if(el.dataset.f&&S.form){S.form[el.dataset.f]=el.type==='number'?Number(el.value):el.value;if(el.tagName==='SELECT')render();else{const card=document.querySelector('#stage .card');if(card){const keep=document.activeElement.id;render();const k=document.getElementById(keep);if(k){k.focus();const v=k.value;if(k.setSelectionRange&&k.type==='text')k.setSelectionRange(v.length,v.length)}}}}
  if(el.dataset.fb&&S.form){S.form[el.dataset.fb]=el.checked;render()}
});
document.addEventListener('change',ev=>{const el=ev.target;
  if(el.dataset.perk){const [kind,pid,kid]=el.dataset.perk.split('|');const p=planById(pid);
    if(kind==='ea'){p.perks.earlyAccessHours=Number(el.value);log(`Host set early access on ${p.name} to ${el.value==='0'?'off':el.value+' hours'}.`)}
    if(kind==='gp'){p.perks.guestPasses=Number(el.value);log(`Host set ${p.name} guest passes to ${el.value} per period.`)}
    if(kind==='pk'){const i=p.perks.perkIds.indexOf(kid);if(el.checked&&i<0)p.perks.perkIds.push(kid);if(!el.checked&&i>=0)p.perks.perkIds.splice(i,1);log(`Host ${el.checked?'added':'removed'} ${perkById(kid).partner} ${el.checked?'to':'from'} ${p.name}.`)}
    render();return}
  if(el.dataset.pol){const [eid,cid,pid]=el.dataset.pol.split('|');const c=eventById(eid).categories.find(x=>x.id===cid);const v=el.value;
    if(v==='NONE')delete c.policies[pid];else if(v.startsWith('PCT'))c.policies[pid]={policy:'CUSTOM_PERCENT',value:Number(v.slice(3))};else if(v.startsWith('FLAT'))c.policies[pid]={policy:'CUSTOM_FLAT',value:Number(v.slice(4))};else c.policies[pid]={policy:v};
    log(`Host set ${planById(pid).name} on ${eventById(eid).name} · ${c.name} to ${c.policies[pid]?policyLabel(c.policies[pid]):'no benefit'}.`);render()}
});
render();
})();
</script>

</body>
</html>
